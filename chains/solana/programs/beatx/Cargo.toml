[package]
name = "beatx"
version = "0.1.0"
description = "BeatX prediction market settlement program"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "beatx"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
# Devnet-only fixture mode for acceptance tests. Never enable for Mainnet builds.
devnet-test-mint = []

[dependencies]
anchor-lang = "=0.31.1"
anchor-spl = { version = "=0.31.1", default-features = false, features = ["token", "token_2022"] }
