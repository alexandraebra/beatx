name: BeatX CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run e2e:demo
      - run: npm run build

  solana:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test release-mode program (official BEATX mint)
        run: cargo test --locked --manifest-path chains/solana/programs/beatx/Cargo.toml
      - name: Test Devnet fixture mode (explicit opt-in)
        env:
          BEATX_DEVNET_TEST_MINT_ACK: DEVNET_FIXTURE_ONLY_NOT_MAINNET
        run: cargo test --locked --manifest-path chains/solana/programs/beatx/Cargo.toml --features devnet-test-mint
